<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>ClassTools screen pen</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#ui{touch-action:none;cursor:crosshair}
body.pointer #ui{cursor:default}
/* a barely-visible tint so the layer catches clicks on Windows while drawing */
body.drawing{background:rgba(255,255,255,.004)}
#hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,28,45,.9);color:#fff;font:600 15px "Segoe UI",system-ui,sans-serif;padding:8px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap}
#hint.on{opacity:1}
</style>
</head>
<body class="drawing">
<canvas id="ink"></canvas>
<canvas id="ui"></canvas>
<div id="hint"></div>
<script>
(() => {

const $ = id => document.getElementById(id);
const inkC = $('ink'), ui = $('ui'), inkX = inkC.getContext('2d'), uiX = ui.getContext('2d');

/* ---------- strokes ---------- */
