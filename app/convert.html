<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>ClassTools document converter</title>
<script src="lib/jszip.min.js"></script>
<script src="lib/mammoth.browser.min.js"></script>
<style id="pageCss"></style>
<style>
html,body{margin:0;padding:0;background:#fff}
*{box-sizing:border-box}
/* Word */
.docx{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:11pt;line-height:1.35;color:#000}
.docx h1{font-size:20pt;margin:0 0 8pt}.docx h2{font-size:16pt;margin:12pt 0 6pt}.docx h3{font-size:13pt;margin:10pt 0 4pt}
.docx p{margin:0 0 8pt}.docx img{max-width:100%;height:auto}
.docx table{border-collapse:collapse;margin:0 0 8pt;max-width:100%}.docx td,.docx th{border:1px solid #888;padding:3pt 5pt;vertical-align:top}
.docx table p{margin:0}
.docx hr.pb{border:0;margin:0;break-after:page;page-break-after:always}
.docx h1.title{font-size:26pt;font-weight:normal}
/* PowerPoint */
.slide{position:relative;overflow:hidden;break-after:page;page-break-after:always;background:#fff}
.slide:last-child{break-after:auto;page-break-after:auto}
.sh{position:absolute;overflow:visible}
.tx{position:absolute;inset:0;display:flex;flex-direction:column;overflow:visible;word-wrap:break-word}
.tx p{margin:0;white-space:pre-wrap}
.sh img{position:absolute;inset:0;width:100%;height:100%;display:block}
.sh table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed}
.sh td{padding:3.6pt 7.2pt;vertical-align:top;border:1pt solid #fff;overflow:hidden}
</style>
</head>
<body>
<div id="out"></div>
<script>
'use strict';
const out = document.getElementById('out');
const b64ToBytes = b => { const s = atob(b), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
const waitImages = () => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));

/* ================= Word (.docx) ================= */
async function renderDocx(bytes) {
  const r = await mammoth.convertToHtml({ arrayBuffer: bytes.buffer }, { styleMap: ["br[type='page'] => hr.pb", "p[style-name='Title'] => h1.title:fresh"] });
  document.getElementById('pageCss').textContent = '@page{size:A4 portrait;margin:2cm}';
  out.innerHTML = `<div class="docx">${r.value || '<p>(This document has no text.)</p>'}</div>`;
  await waitImages();
  return { w: 8.27, h: 11.69 };
}

/* ================= PowerPoint (.pptx) ================= */
const EMU_PT = 12700;
const pt = v => (v / EMU_PT).toFixed(2) + 'pt';
const kid = (el, n) => { if (!el) return null; for (const c of el.children) if (c.localName === n) return c; return null; };
const kids = (el, n) => el ? [...el.children].filter(c => c.localName === n) : [];
const path1 = (el, ...ns) => { for (const n of ns) { el = kid(el, n); if (!el) return null; } return el; };
const deep = (el, n) => el ? el.getElementsByTagNameNS('*', n)[0] || null : null;
const attr = (el, a) => el ? el.getAttribute(a) : null;
const rid = (el, a) => el ? (el.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', a) || el.getAttribute('r:' + a)) : null;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function resolvePath(base, target) {
  if (target.startsWith('/')) return target.slice(1);
  const parts = base.split('/'); parts.pop();
  for (const t of target.split('/')) { if (t === '..') parts.pop(); else if (t !== '.') parts.push(t); }
  return parts.join('/');
}

async function renderPptx(bytes) {
  const zip = await JSZip.loadAsync(bytes);
  const cache = {};
  const xml = async p => { if (p in cache) return cache[p]; const f = zip.file(p); cache[p] = f ? new DOMParser().parseFromString(await f.async('string'), 'application/xml') : null; return cache[p]; };
  const rels = async p => { const i = p.lastIndexOf('/'); const d = await xml(p.slice(0, i) + '/_rels/' + p.slice(i + 1) + '.rels'); const m = {};
    if (d) for (const r of d.getElementsByTagNameNS('*', 'Relationship')) { const ext = r.getAttribute('TargetMode') === 'External'; m[r.getAttribute('Id')] = { type: r.getAttribute('Type'), target: ext ? null : resolvePath(p, r.getAttribute('Target')), url: ext ? r.getAttribute('Target') : null }; }
    return m; };
  const byType = (m, t) => Object.values(m).find(r => r.type && r.type.endsWith('/' + t));
  const media = {};
  const dataUri = async p => { if (!p) return null; if (media[p]) return media[p]; const f = zip.file(p); if (!f) return null;
    const ext = p.split('.').pop().toLowerCase(), mime = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', bmp: 'image/bmp', svg: 'image/svg+xml', webp: 'image/webp', tif: 'image/tiff', tiff: 'image/tiff' }[ext];
    if (!mime) return null; media[p] = `data:${mime};base64,` + await f.async('base64'); return media[p]; };

  const pres = await xml('ppt/presentation.xml'), presRels = await rels('ppt/presentation.xml');
  const sz = deep(pres, 'sldSz'), SW = +attr(sz, 'cx') || 9144000, SH = +attr(sz, 'cy') || 6858000;
  const slideIds = [...pres.getElementsByTagNameNS('*', 'sldId')].map(s => presRels[rid(s, 'id')]).filter(Boolean).map(r => r.target);

  let html = '';
  for (const sp of slideIds) {
    const slide = await xml(sp); if (!slide) continue;
    if (attr(slide.documentElement, 'show') === '0') continue;           // hidden slide
    const sRels = await rels(sp), lp = byType(sRels, 'slideLayout'), layoutP = lp && lp.target;
    const layout = layoutP ? await xml(layoutP) : null, lRels = layoutP ? await rels(layoutP) : {};
    const mp = byType(lRels, 'slideMaster'), masterP = mp && mp.target;
    const master = masterP ? await xml(masterP) : null, mRels = masterP ? await rels(masterP) : {};
    const tp = byType(mRels, 'theme'), theme = tp ? await xml(tp.target) : null;
    const ctx = await makeCtx({ slide, layout, master, theme, sRels, lRels, mRels });
    let body = '';
    // background
    const bg = await background(ctx);
    // master and layout decorations (non-placeholder shapes)
    const showM = n => !n || attr(n.documentElement, 'showMasterSp') !== '0';
    if (master && showM(slide) && showM(layout)) body += await tree(path1(master.documentElement, 'cSld', 'spTree'), ctx, ctx.mRels, 'master');
    if (layout && showM(slide)) body += await tree(path1(layout.documentElement, 'cSld', 'spTree'), ctx, ctx.lRels, 'layout');
    body += await tree(path1(slide.documentElement, 'cSld', 'spTree'), ctx, ctx.sRels, 'slide');
    html += `<div class="slide" style="width:${pt(SW)};height:${pt(SH)};${bg}">${body}</div>`;
  }
  if (!html) html = `<div class="slide" style="width:${pt(SW)};height:${pt(SH)};display:flex;align-items:center;justify-content:center;font:24pt sans-serif">(No slides found)</div>`;
  document.getElementById('pageCss').textContent = `@page{size:${(SW / 914400).toFixed(3)}in ${(SH / 914400).toFixed(3)}in;margin:0}`;
  out.innerHTML = html;
  await document.fonts.ready; await waitImages();
  return { w: SW / 914400, h: SH / 914400 };

  /* ---------- context: theme colours, fonts, text styles ---------- */
  async function makeCtx(o) {
    const scheme = {}, cs = deep(o.theme, 'clrScheme');
    if (cs) for (const c of cs.children) { const v = kid(c, 'srgbClr'), s = kid(c, 'sysClr'); scheme[c.localName] = v ? attr(v, 'val') : s ? (attr(s, 'lastClr') || '000000') : '000000'; }
    const map = { bg1: 'lt1', tx1: 'dk1', bg2: 'lt2', tx2: 'dk2' }, cm = o.master && kid(o.master.documentElement, 'clrMap');
    if (cm) for (const k of Object.keys(map)) if (attr(cm, k)) map[k] = attr(cm, k);
    const fs = deep(o.theme, 'fontScheme'), font = n => attr(path1(deep(fs, n), 'latin'), 'typeface');
    const major = fs ? font('majorFont') : null, minor = fs ? font('minorFont') : null;
    const txS = o.master && kid(o.master.documentElement, 'txStyles');
    return { ...o, scheme, map, major, minor, title: kid(txS, 'titleStyle'), bodyS: kid(txS, 'bodyStyle'), other: kid(txS, 'otherStyle') };
  }
  function colour(ctx, el, ph) {   // el = solidFill / a gradient stop / fillRef etc.
    if (!el) return null;
    const c = [...el.children].find(x => /Clr$/.test(x.localName)); if (!c) return null;
    let hex = '000000';
    if (c.localName === 'srgbClr') hex = attr(c, 'val');
    else if (c.localName === 'sysClr') hex = attr(c, 'lastClr') || '000000';
    else if (c.localName === 'prstClr') hex = ({ black: '000000', white: 'FFFFFF', red: 'FF0000', blue: '0000FF', green: '008000', yellow: 'FFFF00', gray: '808080', grey: '808080' })[attr(c, 'val')] || '000000';
    else if (c.localName === 'schemeClr') { let v = attr(c, 'val'); if (v === 'phClr') return ph || null; v = ctx.map[v] || v; hex = ctx.scheme[v] || '000000'; }
    let r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16), a = 1;
    for (const m of c.children) {
      const v = +attr(m, 'val') / 100000;
      if (m.localName === 'alpha') a = v;
      else if (m.localName === 'lumMod' || m.localName === 'lumOff' || m.localName === 'tint' || m.localName === 'shade') {
        let [h, s, l] = rgb2hsl(r, g, b);
        if (m.localName === 'lumMod') l *= v; else if (m.localName === 'lumOff') l += v;
        else if (m.localName === 'tint') l = l + (1 - l) * (1 - v); else l = l * v;
        [r, g, b] = hsl2rgb(h, s, Math.max(0, Math.min(1, l)));
      }
    }
    return `rgba(${r},${g},${b},${a})`;
  }
  function rgb2hsl(r, g, b) { r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0; const l = (mx + mn) / 2;
    if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h /= 6; } return [h, s, l]; }
  function hsl2rgb(h, s, l) { if (!s) { const v = Math.round(l * 255); return [v, v, v]; } const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    const f = t => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
    return [f(h + 1 / 3), f(h), f(h - 1 / 3)].map(v => Math.round(v * 255)); }
  async function fillCss(ctx, spPr, relMap, styleRef) {
    if (!spPr) spPr = null;
    const sf = kid(spPr, 'solidFill'), gf = kid(spPr, 'gradFill'), bf = kid(spPr, 'blipFill');
    if (kid(spPr, 'noFill')) return '';
    if (sf) return `background:${colour(ctx, sf)};`;
    if (gf) { const st = kids(kid(gf, 'gsLst'), 'gs').map(g => `${colour(ctx, g)} ${(+attr(g, 'pos') / 1000).toFixed(0)}%`);
      const lin = kid(gf, 'lin'), ang = lin ? (+attr(lin, 'ang') / 60000 + 90) : 180; return st.length ? `background:linear-gradient(${ang}deg,${st.join(',')});` : ''; }
    if (bf) { const u = await dataUri((relMap[rid(kid(bf, 'blip'), 'embed')] || {}).target); return u ? `background:url(${u}) center/100% 100% no-repeat;` : ''; }
    if (styleRef && +attr(styleRef, 'idx') > 0) { const c = colour(ctx, styleRef); return c ? `background:${c};` : ''; }
    return '';
  }
  async function background(ctx) {
    for (const [doc, relMap] of [[ctx.slide, ctx.sRels], [ctx.layout, ctx.lRels], [ctx.master, ctx.mRels]]) {
      const bg = doc && path1(doc.documentElement, 'cSld', 'bg'); if (!bg) continue;
      const pr = kid(bg, 'bgPr'); if (pr) return await fillCss(ctx, pr, relMap);
      const ref = kid(bg, 'bgRef'); if (ref) { const c = colour(ctx, ref); return c ? `background:${c};` : ''; }
    }
    return 'background:#fff;';
  }

  /* ---------- placeholders: inherit position and text style from layout / master ---------- */
  function phOf(sp) { const nv = kid(sp, 'nvSpPr') || kid(sp, 'nvPicPr') || kid(sp, 'nvGraphicFramePr'); return nv ? deep(nv, 'ph') : null; }
  function findPh(doc, ph, loose) {
    if (!doc || !ph) return null;
    const type = attr(ph, 'type') || 'body', idx = attr(ph, 'idx');
    const all = [...doc.getElementsByTagNameNS('*', 'sp')].map(s => [s, phOf(s)]).filter(x => x[1]);
    const norm = t => (t === 'ctrTitle' ? 'title' : t === 'subTitle' || t === 'obj' ? 'body' : t);
    let m = idx != null && all.find(([, p]) => attr(p, 'idx') === idx && (attr(p, 'type') || 'body') === type);
    if (!m && idx != null) m = all.find(([, p]) => attr(p, 'idx') === idx);
    if (!m) m = all.find(([, p]) => (attr(p, 'type') || 'body') === type);
    if (!m && loose) m = all.find(([, p]) => norm(attr(p, 'type') || 'body') === norm(type));
    return m ? m[0] : null;
  }
  function inheritChain(sp, ctx, level) {   // shapes to inherit from, nearest first
    const ph = phOf(sp); if (!ph) return [];
    if (level === 'slide') { const l = findPh(ctx.layout, ph, true), m = findPh(ctx.master, l ? phOf(l) : ph, true); return [l, m].filter(Boolean); }
    if (level === 'layout') { const m = findPh(ctx.master, ph, true); return [m].filter(Boolean); }
    return [];
  }
  function xfrmOf(sp) { const pr = kid(sp, 'spPr') || kid(sp, 'grpSpPr'); return kid(pr, 'xfrm') || kid(sp, 'xfrm'); }

  /* ---------- shape tree ---------- */
  async function tree(spTree, ctx, relMap, level, T) {
    if (!spTree) return '';
    T = T || (v => v);
    let h = '';
    for (let el of spTree.children) {
      if (el.localName === 'AlternateContent') { const fb = kid(el, 'Fallback') || kid(el, 'Choice'); if (!fb) continue; for (const c of fb.children) h += await shape(c); continue; }
      h += await shape(el);
    }
    return h;
    async function shape(el) {
      const n = el.localName;
      if (!['sp', 'pic', 'grpSp', 'cxnSp', 'graphicFrame'].includes(n)) return '';
      const ph = phOf(el);
      if (ph && level !== 'slide') return '';            // layout/master placeholders are just prompts
      const chain = inheritChain(el, ctx, level);
      let xf = xfrmOf(el); for (const c of chain) if (!xf || !kid(xf, 'off')) xf = xfrmOf(c);
      const off = kid(xf, 'off'), ext = kid(xf, 'ext');
      if (!off || !ext) return '';
      let x = +attr(off, 'x'), y = +attr(off, 'y'), w = +attr(ext, 'cx'), hh = +attr(ext, 'cy');
      [x, y, w, hh] = T([x, y, w, hh]);
      const rot = (+attr(xf, 'rot') || 0) / 60000, fh = attr(xf, 'flipH') === '1', fv = attr(xf, 'flipV') === '1';
      const tf = (rot || fh || fv) ? `transform:rotate(${rot}deg)${fh ? ' scaleX(-1)' : ''}${fv ? ' scaleY(-1)' : ''};` : '';
      const box = `left:${pt(x)};top:${pt(y)};width:${pt(w)};height:${pt(hh)};${tf}`;
      if (n === 'grpSp') {
        const chOff = kid(xf, 'chOff'), chExt = kid(xf, 'chExt');
        const cx0 = +attr(chOff, 'x') || 0, cy0 = +attr(chOff, 'y') || 0, cw = +attr(chExt, 'cx') || w, ch = +attr(chExt, 'cy') || hh;
        const sx = cw ? w / cw : 1, sy = ch ? hh / ch : 1;
        const inner = await tree(el, ctx, relMap, level, ([a, b, c, d]) => [(a - cx0) * sx, (b - cy0) * sy, c * sx, d * sy]);
        return `<div class="sh" style="${box}">${inner}</div>`;
      }
      if (n === 'pic') {
        const blip = deep(el, 'blip'), u = await dataUri((relMap[rid(blip, 'embed')] || {}).target);
        const phl = deep(kid(el, 'nvPicPr'), 'hlinkClick'), phref = phl && (relMap[rid(phl, 'id')] || {}).url;
        const plk = phref && /^(https?:|mailto:)/i.test(phref) ? `<a href="${esc(phref)}" style="position:absolute;inset:0"></a>` : '';
        return u ? `<div class="sh" style="${box}"><img src="${u}">${plk}</div>` : '';
      }
      if (n === 'cxnSp') {
        const ln = kid(kid(el, 'spPr'), 'ln'), st = kid(el, 'style');
        const col = colour(ctx, kid(ln, 'solidFill')) || colour(ctx, kid(st, 'lnRef')) || '#000';
        const lw = Math.max(0.75, (+attr(ln, 'w') || 12700) / EMU_PT);
        return `<svg class="sh" style="${box}" viewBox="0 0 ${w} ${hh || 1}" preserveAspectRatio="none" overflow="visible"><line x1="0" y1="0" x2="${w}" y2="${hh}" stroke="${col}" stroke-width="${lw}pt" vector-effect="non-scaling-stroke"/></svg>`;
      }
      if (n === 'graphicFrame') {
        const tbl = deep(el, 'tbl');
        if (!tbl) return `<div class="sh" style="${box};border:1pt dashed #bbb;display:flex;align-items:center;justify-content:center;color:#999;font:12pt sans-serif">Chart / object not shown</div>`;
        const cols = kids(kid(tbl, 'tblGrid'), 'gridCol').map(g => +attr(g, 'w'));
        let t = '<table><colgroup>' + cols.map(c => `<col style="width:${pt(c)}">`).join('') + '</colgroup>';
        for (const [ri, tr] of kids(tbl, 'tr').entries()) {
          t += `<tr style="height:${pt(+attr(tr, 'h') || 0)}">`;
          for (const tc of kids(tr, 'tc')) {
            if (attr(tc, 'hMerge') === '1' || attr(tc, 'vMerge') === '1') continue;
            const tcPr = kid(tc, 'tcPr'), f = await fillCss(ctx, tcPr, relMap);
            const bgc = f || (ri === 0 ? `background:${colour(ctx, { children: [mk('schemeClr', 'accent1')] }) || '#4472c4'};` : 'background:#e9edf4;');
            t += `<td${attr(tc, 'gridSpan') ? ` colspan="${attr(tc, 'gridSpan')}"` : ''}${attr(tc, 'rowSpan') ? ` rowspan="${attr(tc, 'rowSpan')}"` : ''} style="${bgc}${ri === 0 ? 'color:#fff;font-weight:bold;' : ''}">${paras(kid(tc, 'txBody'), ctx, [], 'other', 1)}</td>`;
          }
          t += '</tr>';
        }
        return `<div class="sh" style="${box}">${t}</table></div>`;
      }
      // sp
      const spPr = kid(el, 'spPr'), style = kid(el, 'style');
      const geom = kid(spPr, 'prstGeom'), prst = geom ? attr(geom, 'prst') : (kid(spPr, 'custGeom') ? 'cust' : 'rect');
      const fill = await fillCss(ctx, spPr, relMap, kid(style, 'fillRef'));
      const ln = kid(spPr, 'ln');
      let border = '';
      if (ln && kid(ln, 'noFill')) border = '';
      else { const c = colour(ctx, kid(ln, 'solidFill')) || (kid(style, 'lnRef') && +attr(kid(style, 'lnRef'), 'idx') > 0 ? colour(ctx, kid(style, 'lnRef')) : null);
        if (c) border = `border:${Math.max(0.5, (+attr(ln, 'w') || 9525) / EMU_PT).toFixed(2)}pt solid ${c};`; }
      const radius = prst === 'ellipse' ? 'border-radius:50%;' : prst === 'roundRect' ? `border-radius:${pt(Math.min(w, hh) * 0.16)};` : '';
      const clip = { triangle: 'polygon(50% 0,100% 100%,0 100%)', rtTriangle: 'polygon(0 0,100% 100%,0 100%)', diamond: 'polygon(50% 0,100% 50%,50% 100%,0 50%)', rightArrow: 'polygon(0 25%,60% 25%,60% 0,100% 50%,60% 100%,60% 75%,0 75%)', leftArrow: 'polygon(100% 25%,40% 25%,40% 0,0 50%,40% 100%,40% 75%,100% 75%)', hexagon: 'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)', pentagon: 'polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)', parallelogram: 'polygon(25% 0,100% 0,75% 100%,0 100%)', chevron: 'polygon(0 0,75% 0,100% 50%,75% 100%,0 100%,25% 50%)', star5: 'polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)' }[prst];
      const shapeBg = clip ? `<div style="position:absolute;inset:0;${fill}clip-path:${clip}"></div>` : '';
      const txBody = kid(el, 'txBody');
      let text = '';
      if (txBody && deep(txBody, 't')) {
        const phType = ph ? (attr(ph, 'type') || 'body') : null;
        const kind = !ph ? 'other' : (phType === 'title' || phType === 'ctrTitle') ? 'title' : ['dt', 'ftr', 'sldNum'].includes(phType) ? 'other' : 'body';
        const bodyPrs = [kid(txBody, 'bodyPr'), ...chain.map(c => kid(kid(c, 'txBody'), 'bodyPr'))].filter(Boolean);
        const bp = a => { for (const b of bodyPrs) if (attr(b, a) != null) return attr(b, a); return null; };
        const anchor = bp('anchor') || (kind === 'title' ? 'ctr' : 't');
        const ins = (a, d) => pt(+(bp(a) ?? d));
        const fa = deep(kid(txBody, 'bodyPr'), 'normAutofit'), scale = fa && attr(fa, 'fontScale') ? +attr(fa, 'fontScale') / 100000 : 1;
        const lst = [kid(txBody, 'lstStyle'), ...chain.map(c => kid(kid(c, 'txBody'), 'lstStyle'))].filter(Boolean);
        const wrapNone = bp('wrap') === 'none';
        text = `<div class="tx" style="padding:${ins('tIns', 45720)} ${ins('rIns', 91440)} ${ins('bIns', 45720)} ${ins('lIns', 91440)};justify-content:${anchor === 'ctr' ? 'center' : anchor === 'b' ? 'flex-end' : 'flex-start'};${wrapNone ? 'white-space:nowrap;' : ''}">${paras(txBody, ctx, lst, kind, scale)}</div>`;
      }
      const shl = deep(kid(el, 'nvSpPr'), 'hlinkClick'), shref = shl && (relMap[rid(shl, 'id')] || {}).url;
      const lk = shref && /^(https?:|mailto:)/i.test(shref) ? `<a href="${esc(shref)}" style="position:absolute;inset:0;z-index:5"></a>` : '';
      return `<div class="sh" style="${box}${clip ? '' : fill + border}${radius}">${shapeBg}${text}${lk}</div>`;
    }
  }
  function mk(name, val) { const d = document.implementation.createDocument(null, name); const e = d.documentElement; e.setAttribute('val', val); return e; }

  /* ---------- paragraphs and runs ---------- */
  function paras(txBody, ctx, lstStyles, kind, scale) {
    if (!txBody) return '';
