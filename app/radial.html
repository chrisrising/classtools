<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>ClassTools pen tools</title>
<style>
*{box-sizing:border-box;-webkit-user-drag:none}
html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none;touch-action:none;font-family:"Segoe UI",system-ui,sans-serif}
#fan{position:absolute;inset:0}
.item{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:3px solid #fff;padding:0;cursor:pointer;
  background:#eceff4;box-shadow:0 4px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;
  transform:scale(.2);opacity:0;transition:transform .18s cubic-bezier(.2,1.5,.4,1),opacity .15s}
body.open .item{transform:scale(1);opacity:1}
.item svg{width:34px;height:34px}
.item span{font-size:10.5px;font-weight:800;color:#222;margin-top:1px;letter-spacing:.02em}
.item.on{background:#c9f7d6;box-shadow:0 0 0 3px #22c55e,0 0 16px 4px rgba(34,197,94,.7),0 4px 0 rgba(0,0,0,.45)}
.item:active{transform:scale(.94)}
.col{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;cursor:pointer;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.5);transform:scale(.2);opacity:0;transition:transform .18s .05s,opacity .15s .05s}
body.open .col{transform:scale(1);opacity:1}
.col.on{outline:3px solid #22c55e;outline-offset:1px}
.col.pick{display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;text-shadow:0 0 3px #000}
.item.away span{color:#b91c1c}
body.many .item{width:68px;height:68px;margin:-34px 0 0 -34px}
body.many .item svg{width:30px;height:30px}
body.many .item span{font-size:9.5px}
#grid{position:absolute;top:50%;transform:translateY(-50%);width:176px;padding:10px;border-radius:16px;background:rgba(18,22,30,.96);border:1.5px solid rgba(255,255,255,.25);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#grid .g{width:32px;height:32px;border-radius:50%;border:2.5px solid #fff;padding:0;cursor:pointer}
#grid .g.on{outline:3px solid #22c55e;outline-offset:1px}
#grid .gl{grid-column:1/-1;text-align:center;color:#dfe5f2;font-size:11.5px;font-weight:700}
#hub{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(18,22,30,.92);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div id="fan"></div>
<script>
(() => {
const cc = window.cc, fan = document.getElementById('fan');
const ICON = {
  pen: '<svg viewBox="0 0 32 32"><path d="M6 26l2.2-6.6L21.5 6.1a2.6 2.6 0 0 1 3.7 0l.7.7a2.6 2.6 0 0 1 0 3.7L12.6 23.8z" fill="#2f6fe0" stroke="#173d86" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 26l2.2-6.6 4.4 4.4z" fill="#ffd9a8" stroke="#173d86" stroke-width="1.2" stroke-linejoin="round"/><path d="M6 26l1-3 2 2z" fill="#222"/></svg>',
  ruler: '<svg viewBox="0 0 32 32"><g transform="rotate(-35 16 16)"><rect x="1" y="11" width="30" height="10" rx="1.5" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1.5"/><path d="M5 11v4M9 11v6M13 11v4M17 11v6M21 11v4M25 11v6" stroke="#1e3a8a" stroke-width="1.3"/></g></svg>',
  protractor: '<svg viewBox="0 0 32 32"><path d="M2 24h28A14 14 0 0 0 2 24z" fill="#fff1d6" stroke="#7c4a03" stroke-width="1.6"/><path d="M16 24l7-9" stroke="#d42a2a" stroke-width="2" stroke-linecap="round"/><path d="M6 24a10 10 0 0 1 20 0" fill="none" stroke="#7c4a03" stroke-width="1" stroke-dasharray="1.5 2"/><circle cx="16" cy="24" r="1.6" fill="#d42a2a"/></svg>',
  compass: '<svg viewBox="0 0 32 32"><circle cx="16" cy="5" r="2.6" fill="#555"/><path d="M15 7L7 27M17 7l8 20" stroke="#555" stroke-width="2.4" stroke-linecap="round"/><path d="M5 21a12 7 0 0 0 22 0" fill="none" stroke="#2f6fe0" stroke-width="1.6" stroke-dasharray="2 2"/><circle cx="25" cy="27" r="1.6" fill="#2f6fe0"/></svg>',
  away: '<svg viewBox="0 0 32 32"><path d="M6 26l2.2-6.6L21.5 6.1a2.6 2.6 0 0 1 3.7 0l.7.7a2.6 2.6 0 0 1 0 3.7L12.6 23.8z" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round"/><circle cx="22" cy="22" r="8" fill="#dc2626" stroke="#fff" stroke-width="1.5"/><path d="M18.5 18.5l7 7M25.5 18.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>',
  eraser: '<svg viewBox="0 0 32 32"><g transform="rotate(-35 16 16)"><rect x="3" y="10" width="26" height="12" rx="2.5" fill="#f472b6" stroke="#831843" stroke-width="1.6"/><path d="M20 10v12" stroke="#831843" stroke-width="1.4"/><rect x="20" y="10" width="9" height="12" rx="2.5" fill="#60a5fa" stroke="#831843" stroke-width="1.6"/></g><path d="M4 29h14" stroke="#9ca3af" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 2.5"/></svg>',
  pdf: '<svg viewBox="0 0 32 32"><path d="M7 3h13l6 6v20H7z" fill="#fff" stroke="#333" stroke-width="1.6" stroke-linejoin="round"/><path d="M20 3v6h6" fill="#e5e7eb" stroke="#333" stroke-width="1.4" stroke-linejoin="round"/><path d="M10 15h12M10 19h12M10 23h8" stroke="#2f6fe0" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
const ITEMS = [['pen', 'Pen'], ['eraser', 'Rubber'], ['ruler', 'Ruler'], ['protractor', 'Protractor'], ['compass', 'Compass'], ['pdf', 'Page / Doc']];
const COLS = ['#7a3cc8', '#111111', '#d42a2a', '#1f5fd1', '#138a36'];
const GRID = ['#000000','#4b5563','#9ca3af','#ffffff','#7a3cc8','#a855f7','#ec4899','#be123c','#dc2626','#f97316','#f59e0b','#facc15','#84cc16','#16a34a','#0d9488','#06b6d4','#1d4ed8','#2563eb','#6366f1','#7c2d12'];
let state = { side: 'right', color: '#7a3cc8', active: {}, annotActive: false, picking: false };
function build() {
  const W = innerWidth, H = innerHeight, cx = state.side === 'right' ? W - 36 : 36, cy = H / 2, dir = state.side === 'right' ? -1 : 1;
  let h = `<div id="hub" style="left:${cx}px;top:${cy}px">✕</div>`;
  const items = state.annotActive ? [...ITEMS, ['away', 'Put pen away']] : ITEMS, n = items.length, span = 170, rr = n > 6 ? 170 : 150;
  document.body.classList.toggle('many', n > 6);
  items.forEach(([id, label], i) => { const a = (-span / 2 + i * span / (n - 1)) * Math.PI / 180, r = rr;
    h += `<button class="item${state.active[id] ? ' on' : ''}${id === 'away' ? ' away' : ''}" data-id="${id}" style="left:${cx + dir * r * Math.cos(a)}px;top:${cy + r * Math.sin(a)}px;transition-delay:${i * 25}ms">${ICON[id]}<span>${label}</span></button>`; });
  const custom = !COLS.includes(state.color);
  [...COLS, 'pick'].forEach((c, i) => { const a = (-70 + i * 28) * Math.PI / 180, r = 84;
    const bg = c === 'pick' ? (custom ? state.color : 'conic-gradient(red,yellow,lime,cyan,blue,magenta,red)') : c;
    h += `<button class="col${(c === state.color || (c === 'pick' && custom)) ? ' on' : ''}${c === 'pick' ? ' pick' : ''}" data-c="${c}" title="${c === 'pick' ? 'More colours' : ''}" style="left:${cx + dir * r * Math.cos(a)}px;top:${cy + r * Math.sin(a)}px;background:${bg}">${c === 'pick' ? '<b>+</b>' : ''}</button>`; });
  if (state.picking) h += `<div id="grid" style="${state.side === 'right' ? 'right:58px' : 'left:58px'}">${GRID.map(c => `<button class="g${c === state.color ? ' on' : ''}" data-g="${c}" style="background:${c}"></button>`).join('')}<div class="gl">Pick a pen colour</div></div>`;
  fan.innerHTML = h;
  document.body.classList.remove('open'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('open')));
}
fan.addEventListener('pointerup', e => {
  const g = e.target.closest('.g'); if (g) { state.color = g.dataset.g; state.picking = false; build(); cc && cc.radialColor(state.color); return; }
  if (e.target.closest('#grid')) return;
  const it = e.target.closest('.item'), col = e.target.closest('.col');
  if (col && col.dataset.c === 'pick') { state.picking = !state.picking; build(); return; }
  if (state.picking) { state.picking = false; build(); return; }
  if (it) { cc && cc.radialPick(it.dataset.id); return; }
  if (col) { state.color = col.dataset.c; fan.querySelectorAll('.col').forEach(b => b.classList.toggle('on', b === col)); cc && cc.radialColor(state.color); return; }
  cc && cc.radialClose();     // tapped the hub or empty space
});
document.addEventListener('contextmenu', e => e.preventDefault());
if (cc) cc.on('radial-open', o => { Object.assign(state, o); build(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && cc) cc.radialClose(); });
window.__radial = { state, build };
build();
})();
</script>
</body>
</html>
